<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>塔罗占卜</title>
<link rel="stylesheet" href="tarot.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<a class="back" href="index.html">‹ 照片墙</a>
<p id="qline"></p>
<p id="hint">轻触魔法书</p>

<section id="ask">
  <h2><i>TAROT</i>你想问什么？</h2>
  <div id="chips"></div>
  <ul id="qs"></ul>
  <button id="go" type="button" disabled>带着这个问题抽牌</button>
</section>

<section id="panel">
  <div id="read"></div>
  <div class="act"><button id="again" type="button">换个问题再抽</button><a href="index.html">回到照片墙</a></div>
  <small>占卜仅供娱乐，别太当真。</small>
</section>

<div id="load">星象校准中…</div>
<noscript><p style="position:fixed;top:40%;width:100%;text-align:center">需要开启 JavaScript 才能占卜。</p></noscript>
<script>
// 从首页传送门过来时，先用白光盖住画面，避免闪烁
try{if(sessionStorage.getItem('tarotArrive'))document.getElementById('flash').style.opacity=1}catch(e){}
// 先加载 three.min.js（优先同目录），再按顺序加载题库、牌面绘制、主程序
(function(){
  var u=['three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'],i=0;
  function chain(l){
    if(!l.length)return;
    var s=document.createElement('script');s.src=l[0];
    s.onload=function(){chain(l.slice(1))};document.body.appendChild(s);
  }
  function n(){
    if(i>=u.length){document.getElementById('load').textContent='three.js 加载失败：请把 three.min.js 放到本页同目录';return}
    var s=document.createElement('script');s.src=u[i++];
    s.onload=function(){if(window.THREE)chain(['questions.js','tarot-art.js','tarot.js']);else n()};
    s.onerror=n;document.body.appendChild(s);
  }
  n();
})();
</script>
</body>
</html>
