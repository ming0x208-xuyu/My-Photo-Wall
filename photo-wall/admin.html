<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="照片后台">
<title>后台 · Studio</title>
<link rel="stylesheet" href="tools.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="bgx" aria-hidden="true"><i></i><i></i></div>

<header class="th">
  <a class="back" href="index.html">← 返回照片墙</a>
  <h1>后台</h1>
  <p class="en">Studio</p>
  <p class="sub">只有你自己能进入的上传后台：选好照片，点一下，网站自动更新</p>
</header>

<!-- 登录 -->
<main id="loginBox" hidden>
  <div class="card lg">
    <label for="pw" class="lgt">请输入后台密码</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="密码" enterkeyhint="go">
    <p class="lgerr" id="pwErr" hidden></p>
    <button class="btn" id="pwGo" type="button">登 录</button>
    <p class="tip">登录一次后，这台手机会保持登录 30 天。</p>
  </div>
</main>

<!-- 后台 -->
<div id="app" hidden>
  <nav class="tabs" role="tablist">
    <button class="on" data-tab="up" role="tab">上传照片 <small>Upload</small></button>
    <button data-tab="mg" role="tab">管理照片 <small>Manage</small></button>
  </nav>

  <main>
    <!-- 上传 -->
    <section id="up" class="panel on">
      <div class="card">
        <p class="lab2">放进哪个分类</p>
        <div class="chips cat" id="catChips"></div>
        <div class="newcat" id="newCatBox" hidden><input id="newCat" type="text" maxlength="30" placeholder="输入新分类名，例如：旅行" enterkeyhint="done"></div>
        <label class="chk"><input id="optGps" type="checkbox" checked> 去掉照片里的位置信息（推荐）<small>网站上的原图是公开可下载的，手机照片通常带有拍摄地点。拍摄时间、相机参数会保留。</small></label>
      </div>

      <label class="drop" id="upDrop" tabindex="0">
        <input class="fin" id="upIn" type="file" accept="image/*" multiple tabindex="-1" aria-label="选择照片">
        <b>点击选择照片，或把照片拖到这里</b>
        <span>可一次选多张（最多 40 张）；JPG / PNG / WebP，单张不超过 25MB</span>
      </label>

      <div class="sum" id="upCtl" hidden>
        <div class="sumt"><span id="upCount"></span></div>
        <div class="sumb"><button class="btn ghost" id="upClear" type="button">清空</button><button class="btn" id="upGo" type="button">上传</button></div>
      </div>
      <div class="prog" id="upProg" hidden><i id="upBar"></i></div>
      <p class="status" id="upStatus"></p>
      <div class="list" id="upList"></div>

      <div class="card done" id="upDone" hidden>
        <p class="dn1" id="dn1"></p>
        <p class="dn2" id="dn2"></p>
      </div>
    </section>

    <!-- 管理 -->
    <section id="mg" class="panel">
      <div class="sum" id="mgBar">
        <div class="sumt"><span id="mgCount">读取中…</span></div>
        <div class="sumb"><button class="btn ghost" id="mgRefresh" type="button">刷新</button><button class="btn danger" id="mgDel" type="button" disabled>删除选中</button></div>
      </div>
      <p class="tip" style="margin-top:10px">点一下照片即可选中；删除会同时从 GitHub 里移除原图，网站约 1–3 分钟后更新。</p>
      <div class="mg" id="mgGrid"></div>
    </section>
  </main>

  <p class="foot"><button class="lnk" id="logout" type="button">退出登录</button></p>
</div>

<div id="toast" role="status"></div>
<script src="admin.js"></script>
</body>
</html>
