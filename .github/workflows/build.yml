# 自动生成缩略图：只要 photos/ 里有新增或删除的照片（比如从手机后台上传），
# 这里就会自动运行 build.py，把生成的 thumbs/、large/、photos.js 提交回仓库，Cloudflare 随后自动部署。
# 这个文件要放在仓库的  .github/workflows/build.yml
name: build-photos

on:
  push:                     # 不限定分支名（main / master 都行）
    paths:
      - "photos/**"
      - "build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:        # 也可以在 GitHub 的 Actions 页面手动点“Run workflow”，立刻重新生成一遍

permissions:
  contents: write           # 允许把生成结果提交回仓库

concurrency:
  group: build-photos       # 同一时间只跑一个，避免连续上传时互相冲突
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"       # 让中文文件名/中文输出在服务器上也不出错
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Pillow
        run: pip install pillow

      - name: 生成缩略图和照片清单
        run: python build.py

      - name: 把生成结果提交回仓库
        run: |
          git config user.name "photo-wall-bot"
          git config user.email "photo-wall-bot@users.noreply.github.com"
          BR="${GITHUB_REF_NAME}"

          # 把生成结果提交成一个 commit。没有变化返回 1。
          # 逐个添加：不存在的跳过；-f 表示即使被 .gitignore 挡住也照样提交
          commit_generated() {
            for f in thumbs large photos.js og.jpg .build-cache.json; do
              if [ -e "$f" ]; then git add -A -f -- "$f"; fi
            done
            if git diff --cached --quiet; then return 1; fi
            git commit -q -m "自动生成缩略图和照片清单"
          }

          # 缩略图和 photos.js 是“由照片算出来的文件”，不能合并，只能重新生成。
          # 所以：推送被拒绝（构建期间远程又有了新提交）时，不做 rebase 合并，
          # 而是丢掉这次的结果 → 取最新代码 → 重新生成 → 再推送。
          for attempt in 1 2 3 4 5; do
            if ! commit_generated; then echo "没有变化，不需要提交"; exit 0; fi
            if git push origin "HEAD:${BR}"; then echo "已推送"; exit 0; fi
            echo "第 ${attempt} 次推送失败（远程有新提交），取最新代码后重新生成…"
            git fetch origin "${BR}"
            git reset --hard "origin/${BR}"
            python build.py
          done
          echo "连续 5 次都推送失败，请稍后在 Actions 页面点 Run workflow 重试"
          exit 1
