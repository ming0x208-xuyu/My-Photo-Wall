# 自动生成缩略图：只要 photos/ 里有新增或删除的照片（比如从手机后台上传），
# 这里就会自动运行 build.py，把生成的 thumbs/、large/、photos.js 提交回仓库，Cloudflare 随后自动部署。
# 这个文件要放在仓库的  .github/workflows/build.yml
name: build-photos

on:
  push:
    branches: [main]
    paths:
      - "photos/**"
      - "build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:        # 也可以在 GitHub 的 Actions 页面手动点“Run workflow”

permissions:
  contents: write           # 允许把生成结果提交回仓库

concurrency:
  group: build-photos       # 同一时间只跑一个，避免连续上传时互相冲突
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Pillow
        run: pip install pillow

      - name: 生成缩略图和照片清单
        run: python build.py

      - name: 把生成结果提交回仓库
        run: |
          git config user.name "photo-wall-bot"
          git config user.email "photo-wall-bot@users.noreply.github.com"
          git add -A thumbs large photos.js og.jpg .build-cache.json
          if git diff --cached --quiet; then
            echo "没有变化，不需要提交"
          else
            git commit -m "自动生成缩略图和照片清单"
            git pull --rebase origin main
            git push
          fi
