<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的照片墙</title>
<style>
:root{--bg:#f6f3ee;--fg:#2a2622;--mute:#8a8178;--card:#e9e3da;--acc:#c0714a}
@media(prefers-color-scheme:dark){:root{--bg:#161412;--fg:#ece6dd;--mute:#8d857b;--card:#221f1c;--acc:#e09068}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:"Noto Serif SC","Songti SC",Georgia,serif;min-height:100vh}
header{text-align:center;padding:64px 20px 28px}
h1{font-size:clamp(28px,5vw,46px);font-weight:600;letter-spacing:.12em}
header p{color:var(--mute);margin-top:12px;letter-spacing:.2em;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px 16px 28px;font-family:system-ui,sans-serif}
.chip,.add{border:1px solid var(--mute);background:none;color:var(--fg);border-radius:999px;padding:6px 16px;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover,.add:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.add input{display:none}
.wall{columns:4 240px;column-gap:14px;max-width:1360px;margin:0 auto;padding:0 14px 60px}
.item{break-inside:avoid;margin-bottom:14px;border-radius:12px;overflow:hidden;position:relative;cursor:zoom-in;background:var(--card);min-height:120px;animation:up .6s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.item img{width:100%;display:block;opacity:0;transition:opacity .5s,transform .6s}
.item img.ok{opacity:1}
.item:hover img{transform:scale(1.05)}
.cap{position:absolute;inset:auto 0 0 0;padding:28px 14px 10px;color:#fff;font-size:13px;letter-spacing:.08em;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:.3s;font-family:system-ui,sans-serif}
.item:hover .cap{opacity:1}
.empty{text-align:center;color:var(--mute);padding:80px 0}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 0 40px;letter-spacing:.15em}
#lb{position:fixed;inset:0;background:rgba(10,9,8,.94);display:none;align-items:center;justify-content:center;z-index:9;flex-direction:column;padding:20px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:82vh;border-radius:6px;box-shadow:0 10px 60px #000a}
#lbc{color:#ddd;margin-top:14px;font-size:14px;letter-spacing:.1em;text-align:center}
#lb button{position:absolute;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;opacity:.7;padding:14px}
#lb button:hover{opacity:1}
#x{top:6px;right:10px}#pv{left:6px;top:50%}#nx{right:6px;top:50%}
</style>
</head>
<body>
<header><h1 id="t"></h1><p id="s"></p></header>
<div class="bar" id="bar"></div>
<main class="wall" id="wall"></main>
<footer id="f"></footer>
<div id="lb"><button id="x">×</button><button id="pv">‹</button><button id="nx">›</button><img id="lbi" alt=""><div id="lbc"></div></div>

<script>
/* ========== 配置区：只需改这里 ========== */
const SITE = { title: "我的照片墙", subtitle: "把值得记住的瞬间，挂在墙上" };
const PHOTOS = [
  // 把照片放进 photos 文件夹，然后按下面格式加一行：
  // { src: "photos/sunset.jpg", title: "海边日落", tag: "旅行" },
];
/* ====================================== */

const $ = id => document.getElementById(id);
let list = PHOTOS.slice(), cur = "全部", shown = [], idx = 0;
document.title = SITE.title; $("t").textContent = SITE.title; $("s").textContent = SITE.subtitle;
$("f").textContent = "© " + new Date().getFullYear() + " " + SITE.title;

if (!list.length) { // 没有照片时显示示例渐变图
  list = Array.from({ length: 16 }, (_, i) => {
    const h = [300, 420, 520, 360, 460][i % 5], a = (i * 47) % 360;
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='${h}'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${a},60%,72%)'/><stop offset='1' stop-color='hsl(${a + 50},65%,45%)'/></linearGradient></defs><rect width='400' height='${h}' fill='url(#g)'/></svg>`;
    return { src: "data:image/svg+xml," + encodeURIComponent(svg), title: "示例 " + (i + 1), tag: ["旅行", "日常", "人像"][i % 3] };
  });
}

function bar() {
  const tags = ["全部", ...new Set(list.map(p => p.tag).filter(Boolean))];
  $("bar").innerHTML = "";
  tags.forEach(t => {
    const b = document.createElement("button");
    b.className = "chip" + (t === cur ? " on" : ""); b.textContent = t;
    b.onclick = () => { cur = t; bar(); wall(); };
    $("bar").appendChild(b);
  });
  const l = document.createElement("label");
  l.className = "add"; l.title = "仅在本机预览，刷新后消失";
  l.innerHTML = "＋ 本地预览<input type='file' accept='image/*' multiple>";
  l.querySelector("input").onchange = e => {
    [...e.target.files].forEach(f => list.unshift({ src: URL.createObjectURL(f), title: f.name.replace(/\.[^.]+$/, ""), tag: "本地预览" }));
    bar(); wall();
  };
  $("bar").appendChild(l);
}

function wall() {
  shown = list.filter(p => cur === "全部" || p.tag === cur);
  const w = $("wall"); w.innerHTML = "";
  if (!shown.length) { w.innerHTML = "<div class='empty'>这里还没有照片</div>"; return; }
  shown.forEach((p, i) => {
    const d = document.createElement("figure");
    d.className = "item"; d.style.animationDelay = Math.min(i * 40, 600) + "ms";
    const im = new Image(); im.loading = "lazy"; im.alt = p.title || ""; im.src = p.src;
    im.onload = () => im.classList.add("ok");
    d.append(im);
    if (p.title) { const c = document.createElement("div"); c.className = "cap"; c.textContent = p.title; d.append(c); }
    d.onclick = () => open(i);
    w.appendChild(d);
  });
}

function open(i) { idx = (i + shown.length) % shown.length; const p = shown[idx];
  $("lbi").src = p.src; $("lbc").textContent = (p.title || "") + "  " + (idx + 1) + " / " + shown.length;
  $("lb").classList.add("on"); }
const close = () => $("lb").classList.remove("on");
$("x").onclick = close; $("pv").onclick = e => { e.stopPropagation(); open(idx - 1); };
$("nx").onclick = e => { e.stopPropagation(); open(idx + 1); };
$("lb").onclick = e => { if (e.target.id === "lb") close(); };
addEventListener("keydown", e => { if (!$("lb").classList.contains("on")) return;
  if (e.key === "Escape") close(); if (e.key === "ArrowLeft") open(idx - 1); if (e.key === "ArrowRight") open(idx + 1); });
let sx = 0;
$("lb").addEventListener("touchstart", e => sx = e.touches[0].clientX);
$("lb").addEventListener("touchend", e => { const d = e.changedTouches[0].clientX - sx; if (Math.abs(d) > 50) open(idx + (d < 0 ? 1 : -1)); });

bar(); wall();
</script>
</body>
</html>
